rules:
  - id: mcp-tool-handler-reads-credential-path
    languages: [python]
    severity: ERROR
    mode: search
    message: "An MCP tool handler reads a credential-shaped path or environment variable."
    metadata:
      aevrin-capability: credential_access
      aevrin-owasp: MCP01
    patterns:
      - pattern-inside: |
          @$DECORATOR.tool(...)
          def $FUNC(...):
              ...
      - pattern-either:
          - patterns:
              - pattern: open($PATH, ...)
              - metavariable-regex:
                  metavariable: $PATH
                  regex: '.*(aws.{0,2}credentials|\.ssh.{0,2}id_(rsa|ed25519)|\.env)[\"\x27]?$'
          - patterns:
              - pattern: os.environ[$KEY]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: "(?i).*(api.?key|token|secret|password).*"

  - id: mcp-tool-handler-reads-credential-path-ts
    languages: [typescript, javascript]
    severity: ERROR
    mode: search
    message: "An MCP tool handler reads a credential-shaped path or environment variable."
    metadata:
      aevrin-capability: credential_access
      aevrin-owasp: MCP01
    patterns:
      - pattern-either:
          - pattern-inside: |
              $SERVER.registerTool($NAME, $OPTS, async ($ARG) => { ... })
          - pattern-inside: |
              $SERVER.registerTool($NAME, $OPTS, ($ARG) => { ... })
          - pattern-inside: |
              $SERVER.tool($NAME, $DESC, $SCHEMA, async ($ARG) => { ... })
          - pattern-inside: |
              $SERVER.tool($NAME, $DESC, $SCHEMA, ($ARG) => { ... })
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $FS.readFileSync($PATH, ...)
                  - pattern: $FS.readFile($PATH, ...)
              - metavariable-regex:
                  metavariable: $PATH
                  regex: '.*(aws.{0,2}credentials|\.ssh.{0,2}id_(rsa|ed25519)|\.env)[\"\x27]?$'
          - patterns:
              - pattern: process.env[$KEY]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: "(?i).*(api.?key|token|secret|password).*"
          - patterns:
              - pattern: process.env.$KEY
              - metavariable-regex:
                  metavariable: $KEY
                  regex: "(?i).*(api.?key|token|secret|password).*"
