[project]
name = "aevrin-scanner-core"
version = "0.4.0"
description = "Shared scanning engine for Aevrin: models, OWASP MCP Top 10 mapping, scoring, and containerized scanner adapters. Imported by backend/api and backend/cli so findings never drift into different vocabularies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.1.1",
    "pydantic>=2.9",
    "httpx>=0.27",
    # Codex configuration is TOML. tomllib is stdlib from 3.11; this package
    # still supports 3.10, where it is not.
    "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
    # Unconditional here so mypy, which type-checks against the 3.10 floor,
    # can see the fallback import even when running on a newer interpreter.
    "tomli>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.13.0"]
build-backend = "uv_build"

# Flat layout: the package sits at the project root rather than under a
# src/ wrapper. The directory name is the import name and is published, so
# it stays aevrin_scanner_core; only the redundant src/ level is gone.
[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py310"
# Semgrep rule-pack regression fixtures, not real importable code - `mcp`
# is a stand-in decorator target the fixtures never define, and the shell
# commands are deliberately unsafe. See tests/test_rule_pack_corpus.py.
exclude = ["rule_pack_corpus"]

[tool.mypy]
python_version = "3.10"
strict = true
# Analyse for the deployment target regardless of the developer's OS.
# Without this, POSIX-only members (resource.RLIMIT_*) look missing on
# Windows while Windows-only ones (winreg) look missing on Linux, so the
# same code fails type-checking on one machine and passes on another.
platform = "linux"
