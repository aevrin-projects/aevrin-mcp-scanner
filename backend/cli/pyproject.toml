[project]
name = "aevrin"
version = "0.3.1"
description = "Aevrin MCP Security Scanner CLI: scan a source repository, local path, or live MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aevrin" }]
keywords = ["mcp", "security", "scanner", "model-context-protocol"]
dependencies = [
    "aevrin-scanner-core>=0.3.0",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.27",
]

[project.scripts]
aevrin = "aevrin_cli.main:app"

[project.urls]
Homepage = "https://mcp.aevrin.net"
Documentation = "https://mcp.aevrin.net/docs"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv.sources]
aevrin-scanner-core = { path = "../scanner-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aevrin_cli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
# Analyse for the deployment target regardless of the developer's OS.
# Without this, POSIX-only members (resource.RLIMIT_*) look missing on
# Windows while Windows-only ones (winreg) look missing on Linux, so the
# same code fails type-checking on one machine and passes on another.
platform = "linux"
