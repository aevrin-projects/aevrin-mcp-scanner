name: Deploy docs

# Redeploys docs.mcp.aevrin.net whenever something it's actually built from
# changes on master -- MDX content included. Split out from deploy-frontend.yml
# (see DECISIONS.md) because the combined Worker (dashboard + marketplace +
# admin + fumadocs/MDX rendering) exceeded Cloudflare's free-plan 3 MiB Worker
# size limit. Since ADR-010, this deploys a plain static export (`next build`
# with `output: "export"`) as a Worker with static assets and no script at
# all, rather than an OpenNext Worker -- there is no per-request server code
# left to size, so this needs no Cloudflare plan beyond free.
on:
  push:
    branches: [master]
    paths:
      - "frontend-docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

# Never cancel a deploy that is already uploading: a half-applied Worker is
# worse than a queued one. Later pushes wait instead.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: cloudflare
    defaults:
      run:
        working-directory: frontend-docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-docs/package-lock.json

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Deploy
        # wrangler is already a devDependency, so this needs no third-party
        # action and nothing extra to pin.
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
