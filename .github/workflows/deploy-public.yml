name: Deploy public site

# frontend-public/ is a static export carrying the marketing/content routes
# split out of frontend/ (see DECISIONS.md ADR-011): home, cli, contact,
# terms, privacy, refund, status. No Worker script, no Cloudflare plan
# requirement beyond free.
#
# Not yet bound to mcp.aevrin.net in wrangler.jsonc -- that cutover needs
# every OAuth provider's redirect URI updated to app.mcp.aevrin.net first
# (an external, account-holder-only step; see docs/architecture/DEPLOYMENT.md).
# Until then this deploys to its own workers.dev URL for verification.
on:
  push:
    branches: [master]
    paths:
      - "frontend-public/**"
      - ".github/workflows/deploy-public.yml"
  workflow_dispatch:

concurrency:
  group: deploy-public
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: cloudflare
    defaults:
      run:
        working-directory: frontend-public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # sitemap.xml reads each page's last commit date with `git log`,
          # same reasoning as frontend/'s deploy workflow.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-public/package-lock.json

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.mcp.aevrin.net
          NEXT_PUBLIC_SITE_URL: https://mcp.aevrin.net
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
