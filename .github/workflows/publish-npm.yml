name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish aevrin to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend/cli-npm
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Publish
        id: publish
        # No token. This authenticates over OIDC as a trusted publisher, which
        # is why `id-token: write` and `environment: npm` above are load-bearing
        # rather than decorative: npm matches the minted token against the
        # repository, this workflow's filename and that environment name.
        #
        # It used to publish with NPM_TOKEN, and that stopped working: the token
        # could not bypass 2FA, so the registry answered EOTP and asked a CI
        # runner for a one-time password. Reaching for a token that *can* bypass
        # 2FA was the other option and was not taken - npm is restricting those,
        # and a publishing credential that lives in repository secrets forever is
        # worth removing on its own merits.
        #
        # An earlier comment here said trusted publishing was unavailable "until
        # the package exists", since a publisher is configured against a
        # published package. That was true when it was written. aevrin@0.4.0 is
        # published, so it no longer is.
        #
        # The publisher is registered once, by the package owner, on
        # https://www.npmjs.com/package/aevrin/access under "Trusted Publisher",
        # GitHub Actions:
        #   Organization or user   aevrin-projects
        #   Repository             aevrin-mcp-scanner
        #   Workflow filename      publish-npm.yml
        #   Environment name       npm
        #
        # Use the website. It needs the owner's interactive login with 2FA - an
        # access token, including the one in .npmjs-key/, gets 401 from the trust
        # endpoint - and it needs no particular npm version. The `npm trust`
        # command does the same thing but does not exist in npm 11.6.2 ("Unknown
        # command"), and npm 12 needs Node 22.22.2 or later, so it is not a
        # dependable recipe to hand anyone.
        #
        # npm does not validate a registration when it is saved. A missing or
        # mismatched one surfaces only here: OIDC is not accepted, npm falls back
        # to setup-node's placeholder token (hence the "tokens that bypass 2FA"
        # notice in the log), and the PUT fails with `E404 ... you do not have
        # permission`. The step below says so, because E404 alone does not.
        run: npm publish

      - name: Explain a failed publish
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error title=npm publish refused::If the Publish step ended in E404, no trusted publisher on npmjs.com matches this run. Register one at https://www.npmjs.com/package/aevrin/access (GitHub Actions: aevrin-projects / aevrin-mcp-scanner / publish-npm.yml / environment npm), then re-run with: gh workflow run publish-npm.yml --ref master"
