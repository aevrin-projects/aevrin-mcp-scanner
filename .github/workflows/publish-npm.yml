name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish aevrin to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend/cli-npm
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Publish
        # No token. This authenticates over OIDC as a trusted publisher, which
        # is why `id-token: write` and `environment: npm` above are load-bearing
        # rather than decorative: npm matches the minted token against the
        # repository, this workflow's filename and that environment name.
        #
        # It used to publish with NPM_TOKEN, and that stopped working: the token
        # could not bypass 2FA, so the registry answered EOTP and asked a CI
        # runner for a one-time password. Reaching for a token that *can* bypass
        # 2FA was the other option and was not taken - npm is restricting those,
        # and a publishing credential that lives in repository secrets forever is
        # worth removing on its own merits.
        #
        # An earlier comment here said trusted publishing was unavailable "until
        # the package exists", since a publisher is configured against a
        # published package. That was true when it was written. aevrin@0.4.0 is
        # published, so it no longer is.
        #
        # The publisher is registered out of band, once, with:
        #   npm trust github aevrin --repo aevrin-projects/aevrin-mcp-scanner         #     --file publish-npm.yml --env npm --allow-publish
        run: npm publish
