name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish aevrin to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend/cli-npm
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Publish
        # setup-node writes an .npmrc pointing _authToken at NODE_AUTH_TOKEN,
        # but nothing ever set it, so every run published anonymously and npm
        # answered "E404 PUT /aevrin" -- its response for an unauthenticated
        # write, not a missing package. The name has never been claimed, so
        # the documented `npm install --global aevrin` has always 404d.
        #
        # NPM_TOKEN must be a granular token scoped to *all* packages, or a
        # classic automation token: a token scoped to existing packages only
        # cannot create a new name, and fails the same opaque way. Trusted
        # publishing is not an option until the package exists, since the
        # publisher is configured against an already-published package.
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
