name: CI

# Runs on every push and pull request. Nothing here needs a secret, so it
# also runs for forks.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [scanner-core, cli, api]
    defaults:
      run:
        working-directory: backend/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Sync
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        # Only the package itself: the test suites lean on stubs and
        # monkeypatching that strict mode is not meant to police.
        run: uv run mypy aevrin_${{ matrix.package == 'scanner-core' && 'scanner_core' || matrix.package }}

      - name: Test
        run: uv run pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json is generated by npm 11, which records the bundled
      # and optional dependency subtrees of the wasm packages (@img/sharp-wasm32,
      # @tailwindcss/oxide-wasm32-wasi) differently from npm 10 -- the version
      # Node 22 still bundles. npm 10 reads that lockfile as out of sync and
      # `npm ci` fails with EUSAGE before installing anything. Match the major
      # the lockfile is written with instead of downgrading the lockfile.
      - name: Use the npm major the lockfile was generated with
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders. Every one of these is read at runtime as
          # well, so a wrong value here cannot reach a deployed page; they
          # exist only so the production build can complete.
          NEXT_PUBLIC_API_URL: https://api.aevrin.net
          NEXT_PUBLIC_SITE_URL: https://mcp.aevrin.net
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder

  docker:
    name: api image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Build context is the repo root, not backend/api: the image has to copy
      # the sibling backend/scanner-core package. Building it here is what
      # catches a COPY path breaking when directories move.
      - name: Build API image
        run: docker build -f backend/api/Dockerfile -t aevrin-api:ci .
