name: CLI installation

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.channel }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        channel: [pip, npm]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Set up Node.js
        if: matrix.channel == 'npm'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install with pip
        if: matrix.channel == 'pip'
        run: python -m pip install ./packages/scanner-core ./packages/cli

      - name: Install with npm
        if: matrix.channel == 'npm'
        run: npm install --global ./packages/npm

      - name: Verify CLI
        run: |
          aevrin --version
          aevrin --help
