name: Publish Python packages

# Triggered by a version tag, e.g. `v0.1.0`. Publishes both PyPI packages via
# Trusted Publishing (OIDC): no stored PyPI token. Before the first run,
# register each project as a trusted publisher at
# https://pypi.org/manage/project/<name>/settings/publishing/ (or, for a
# not-yet-existing project, https://pypi.org/manage/account/publishing/)
# pointing at this repo, workflow file `publish.yml`, and the matching
# environment name below.
on:
  push:
    tags:
      - "v*"
  # A tag fires this once. When one package publishes and the other is
  # stopped by its own verify step, the release is half-done and the tag
  # cannot fire again; this finishes it without deleting and re-pushing a
  # tag that has already shipped something. Safe to re-run: both uploads
  # skip a version that is already on PyPI.
  workflow_dispatch:

jobs:
  publish-scanner-core:
    name: Publish aevrin-scanner-core
    runs-on: ubuntu-latest
    environment: pypi-scanner-core
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Build
        working-directory: backend/scanner-core
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: backend/scanner-core/dist
          skip-existing: true

  publish-cli:
    name: Publish aevrin (CLI)
    runs-on: ubuntu-latest
    needs: publish-scanner-core
    environment: pypi-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Build
        working-directory: backend/cli
        # Build in isolation from the workspace so the wheel records a normal
        # PyPI dependency on aevrin-scanner-core, not the local path override
        # in [tool.uv.sources] (that override only applies to editable dev
        # installs inside this workspace).
        run: uv build --no-sources

      - name: Verify pip installation
        run: |
          python -m venv "${RUNNER_TEMP}/aevrin-pip-verify"
          "${RUNNER_TEMP}/aevrin-pip-verify/bin/python" -m pip install backend/cli/dist/*.whl
          "${RUNNER_TEMP}/aevrin-pip-verify/bin/python" -m pip check
          "${RUNNER_TEMP}/aevrin-pip-verify/bin/aevrin" --version
          # Assert the commands are actually registered, not just that the app
          # starts. A stray decorator once left `scan` unregistered while
          # --help still exited 0, so the CLI shipped without its main command.
          for cmd in scan login logout version hook findings; do
            "${RUNNER_TEMP}/aevrin-pip-verify/bin/aevrin" "$cmd" --help >/dev/null               || { echo "::error::aevrin $cmd is missing from the published wheel"; exit 1; }
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: backend/cli/dist
          skip-existing: true
