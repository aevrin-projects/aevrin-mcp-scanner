[project]
name = "aevrin-api"
version = "0.1.0"
description = "Aevrin backend: orchestrates the scan pipeline, talks to DefectDojo, serves the website and CLI upload."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aevrin-scanner-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "redis>=5.2",
    "boto3>=1.35",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
    "httpx>=0.28.1",
]

[tool.uv.sources]
aevrin-scanner-core = { path = "../../packages/scanner-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aevrin_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
